name: Check Gold Price

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

permissions:
  contents: write # Allows GitHub to update the last_price.txt file

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests beautifulsoup4

    - name: Run Gold Tracker Agent
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python gold_tracker.py

    - name: Commit and Push updated price file
      run: |
        git config --global user.name "GoldBot"
        git config --global user.email "goldbot@github.com"
        git add last_price.txt || true
        git diff --staged --quiet || git commit -m "Update last tracked gold price"
        git pull --rebase origin main
        git push
